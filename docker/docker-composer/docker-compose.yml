version: '3.8'

services:
  # MySQL数据库服务
  # 主程序服务
  main-server:
    image: ${MAIN_SERVER_IMAGE:?Set MAIN_SERVER_IMAGE in .env}
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/secrets/main-config.yaml"]
    ports:
      - "${BIND_IP:-127.0.0.1}:8002:8989"        # OTA 服务（保留设备固定端口）
      - "${BIND_IP:-127.0.0.1}:8010:8989"        # websocket服务 端口 18989端口
      - "${BIND_IP:-127.0.0.1}:2883:2883"        # mqtt server 12883
      - "${BIND_IP:-127.0.0.1}:8888:8888/udp"     # udp server 8888
    depends_on:
      backend:
        condition: service_started
    environment:
      - DB_HOST=${DB_HOST:?Set DB_HOST in .env}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
      - ../../../secrets/main-config.yaml:/workspace/secrets/main-config.yaml:ro
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    networks:
      - xiaozhi-network
    restart: on-failure:3
    mem_limit: 768m
    memswap_limit: 1152m

  # 后端管理服务
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
    container_name: xiaozhi-backend
    ports:
      - "${BIND_IP:-127.0.0.1}:8003:8080"        # 后端管理服务 端口 映射至宿主机 28080
    depends_on:
      voice-server:
        condition: service_started
    environment:
      - DB_HOST=${DB_HOST:?Set DB_HOST in .env}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:?Set DB_NAME in .env}
      - AUDIO_BASE_PATH=/data/chat_history/audio
      - SPEAKER_SERVICE_URL=http://voice-server:9000
    volumes:
      - ../../manager/backend/config:/root/config
      - backend_audio_data:/data/chat_history/audio
    networks:
      - xiaozhi-network
    restart: on-failure:3
    mem_limit: 512m
    memswap_limit: 768m

  # 前端管理服务
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    container_name: xiaozhi-frontend
    ports:
      - "${BIND_IP:-127.0.0.1}:8005:80"           # 前端管理服务
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: on-failure:3
    mem_limit: 128m
    memswap_limit: 192m

  # Qdrant向量数据库服务（用于说话人识别）
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: xiaozhi-qdrant
    ports:
      - "${BIND_IP:-127.0.0.1}:6333:6333"         # REST API 端口
      - "${BIND_IP:-127.0.0.1}:6334:6334"         # gRPC 端口
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: on-failure:3
    mem_limit: 768m
    memswap_limit: 1152m

  # ASR语音识别服务（说话人识别）
  voice-server:
    image: ghcr.io/hackers365/voice_server:0.1.2    # 替换为实际的镜像名称
    container_name: xiaozhi-voice-server
    ports:
      - "${BIND_IP:-127.0.0.1}:8004:9000"         # ASR服务端口（原8082被占，对齐Python版口位顺延）
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - QDRANT_COLLECTION_NAME=speaker_embeddings
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: on-failure:3
    mem_limit: 512m
    memswap_limit: 768m

  jellyfin-mcp:
    image: ghcr.io/jaredtrent/jellyfin-mcp:2026.924.1
    container_name: xiaozhi-jellyfin-mcp
    env_file:
      - ../../../secrets/jellyfin-mcp.env
    command: ["--http", "--addr", "0.0.0.0:8080", "--read-only", "--toolsets", "discovery,media,analytics"]
    ports:
      - "127.0.0.1:3006:8080"
    networks:
      - xiaozhi-network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: on-failure:3
    mem_limit: 256m
    memswap_limit: 384m

volumes:
  backend_audio_data:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
